name: App Android (APK)

on:
  push:
    branches: [main]
    paths-ignore:
      - "notizie/**"
      - ".github/workflows/notizie-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AppuntiVocaliAI-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppuntiVocaliAI-apk
          path: AppuntiVocaliAI-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Appunti Vocali AI 1.0.${{ github.run_number }}
          make_latest: true
          files: AppuntiVocaliAI-*.apk
          body: |
            APK per Android. Aprilo dal telefono, scarica il file `.apk` qui sotto e installalo
            (Android chiederà di consentire l'installazione da questa fonte).
            Al primo avvio apri ⚙️ Impostazioni e inserisci la chiave Claude.
